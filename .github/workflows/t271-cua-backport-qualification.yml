name: T-271 Cua backport qualification (fork only)

# CI CONTROLLER ONLY. This workflow lives on ci/t271-cua-backport-qualification and is NOT part
# of the source it tests. It checks out the frozen repair commit below (never the controller
# branch HEAD), proves that identity, then runs the installed-base gates:
#   * the canonical bash scripts/run_tests.sh over the computer-use tests,
#   * `ruff check .` and scripts/check-windows-footguns.py --all (the blocking jobs in this
#     revision's lint.yml; scripts/check does not exist at this base),
#   * a final `git status --porcelain` cleanliness gate.
# A green run here is a qualification of THAT frozen commit on three hosted OSes. It is NOT
# proof of the repository's full upstream CI (tests.yml, ci.yml, docker, e2e, ... are not run).
# No deployment, release, schedule, secret, self-hosted/paid runner or write permission is used.

on:
  push:
    branches:
      - ci/t271-cua-backport-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t271-cua-backport-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  # Frozen repair commit under test and the installed base it must descend from.
  # FROZEN_SHA is the accepted runtime repair plus one metadata-only contributor-mapping commit.
  FROZEN_SHA: 2b647f6aa308cca467df807f82d497e5a847fcf3
  ACCEPTED_RUNTIME_SHA: fbf7469cadb84707be482739326151037b1290f2
  BASE_SHA: efbfe0842fb99b93f37546cce406307c0f5eaec0

jobs:
  qualify:
    name: qualify (${{ matrix.os }})
    # Fork-only, and only from the controller branch (also bounds manual dispatch).
    if: ${{ github.repository == 'RxFit/hermes-agent' && github.ref == 'refs/heads/ci/t271-cua-backport-qualification' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    env:
      # Never inherit interpreter/activation state into the install or the gates.
      PYTHONPATH: ""
      PYTHONHOME: ""
      __HERMES_ACTIVATED: ""
      # Hermetic: tests must never reach real providers (no secrets are configured here anyway).
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Preserve Git blob bytes (core.autocrlf=false, ephemeral runner only)
        run: |
          set -euo pipefail
          # Runner-local global config. Without this a Windows checkout may convert LF to CRLF
          # and change the raw-byte SHA256 of tracked fixtures.
          git config --global core.autocrlf false
          echo "core.autocrlf: $(git config --global --get core.autocrlf)"

      - name: Checkout frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The frozen commit, regardless of what the controller branch HEAD is.
          ref: ${{ env.FROZEN_SHA }}
          # Full history so the installed-base ancestry can be asserted.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen source identity
        id: verify
        run: |
          set -euo pipefail
          echo "controller (workflow) commit : ${GITHUB_SHA}"
          echo "controller ref               : ${GITHUB_REF}"
          head="$(git rev-parse HEAD)"
          echo "tested source git HEAD       : ${head}"
          echo "expected frozen SHA          : ${FROZEN_SHA}"
          echo "expected base SHA            : ${BASE_SHA}"

          fail() { echo "::error::$*"; exit 1; }

          [ "${head}" = "${FROZEN_SHA}" ] || fail "checked-out HEAD ${head} != frozen SHA ${FROZEN_SHA}"
          [ "${GITHUB_SHA}" != "${FROZEN_SHA}" ] || echo "note: controller commit equals frozen commit"

          # The repair may be several commits (a correction commit follows the first), so assert
          # that the installed base is an ancestor of the frozen commit, not that it is the parent.
          git cat-file -e "${BASE_SHA}^{commit}" || fail "installed base ${BASE_SHA} is not present in the checkout"
          git merge-base --is-ancestor "${BASE_SHA}" "${FROZEN_SHA}" \
            || fail "installed base ${BASE_SHA} is not an ancestor of frozen commit ${FROZEN_SHA}"
          echo "tested source parent(s)      : $(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-)"
          echo "commits on top of base       : $(git rev-list --count "${BASE_SHA}..${FROZEN_SHA}")"
          git log --oneline "${BASE_SHA}..${FROZEN_SHA}"
          echo "installed base is an ancestor of the frozen commit"

          # The controller workflow must not be part of the tested source.
          if [ -e .github/workflows/t271-cua-backport-qualification.yml ]; then
            fail "controller workflow is present in the tested source tree"
          fi

          # Contributor-mapping file: the ONLY path added on top of the accepted runtime commit.
          meta_path="contributors/emails/ada-chat@relevanceai-email-automation.iam.gserviceaccount.com"

          # Scope of the frozen change vs the installed base: exactly these six paths.
          actual="$(git diff --name-only "${BASE_SHA}" "${FROZEN_SHA}" | tr -d '\r' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "${meta_path}" \
            tests/computer_use/test_cua_wsl_manifest_path.py \
            tests/tools/fixtures/cua_036_cli_schemas.json \
            tests/tools/test_computer_use.py \
            tests/tools/test_computer_use_cua_036_token_targeting.py \
            tools/computer_use/cua_backend.py | LC_ALL=C sort)"
          echo "changed paths vs base:"; echo "${actual}"
          [ "${actual}" = "${expected}" ] || fail "frozen diff vs base is not the expected six paths"

          # The frozen source is exactly the accepted runtime commit plus the mapping file:
          # one parent, that parent is the accepted runtime SHA, and the only path changed
          # between them is the literal mapping file, whose first non-comment line is RxFit.
          parents="$(git rev-list --parents -n 1 "${FROZEN_SHA}" | tr -d '\r')"
          [ "${parents}" = "${FROZEN_SHA} ${ACCEPTED_RUNTIME_SHA}" ] \
            || fail "frozen source parent(s) '${parents}' != accepted runtime ${ACCEPTED_RUNTIME_SHA}"
          meta_changed="$(git diff --name-only "${ACCEPTED_RUNTIME_SHA}" "${FROZEN_SHA}" | tr -d '\r')"
          [ "${meta_changed}" = "${meta_path}" ] \
            || fail "paths changed on top of the accepted runtime are not exactly the mapping file: ${meta_changed}"
          meta_author="$(git show "${FROZEN_SHA}:${meta_path}" | awk '!/^#/ {print; exit}')"
          [ "${meta_author}" = "RxFit" ] || fail "mapping first non-comment line is '${meta_author}', not 'RxFit'"
          echo "frozen source = accepted runtime ${ACCEPTED_RUNTIME_SHA} + mapping ${meta_path} (${meta_author})"

          # Retained production added-line ceiling (non-test paths only): <= 180. Only the
          # literal two-line, non-executable contributor mapping is excluded; no runtime file is.
          prod_added="$(git diff --numstat "${BASE_SHA}" "${FROZEN_SHA}" -- . ':!tests' ":!${meta_path}" | awk '{a += $1} END {print a + 0}')"
          echo "production added lines vs base: ${prod_added} (ceiling 180)"
          [ "${prod_added}" -le 180 ] || fail "production added lines ${prod_added} exceed the 180 ceiling"

          # Raw-byte SHA256 of the protected CLI schema fixture (no JSON normalization).
          fixture_sha="ab3bfd206564c4a4f89f06e65791ee970806afd51574e88aa08c467c24901de0"
          fixture_py="$(command -v python3 || command -v python)" || fail "no python available for the fixture hash"
          fixture_actual="$("${fixture_py}" -I -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' tests/tools/fixtures/cua_036_cli_schemas.json | tr -d '\r')"
          echo "cua_036_cli_schemas.json sha256: ${fixture_actual}"
          [ "${fixture_actual}" = "${fixture_sha}" ] || fail "cua_036_cli_schemas.json sha256 ${fixture_actual} != ${fixture_sha}"

          dirty="$(git status --porcelain)"
          [ -z "${dirty}" ] || fail "checkout is not clean before any step ran: ${dirty}"
          echo "frozen source identity verified"

      - name: Prepare isolated paths (all under RUNNER_TEMP)
        id: paths
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/t271"
          ws="${GITHUB_WORKSPACE}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            tmp="$(cygpath -m "${tmp}")"
            ws="$(cygpath -m "${ws}")"
          fi
          case "${tmp}/" in
            "${ws}/"*) echo "::error::scratch dir ${tmp} is inside the source checkout ${ws}"; exit 1 ;;
          esac
          mkdir -p "${tmp}/logs" "${tmp}/hermes-home" "${tmp}/hermes-runtime" "${tmp}/uv-cache" "${tmp}/ruff-cache"
          {
            echo "T271_TMP=${tmp}"
            echo "HERMES_HOME=${tmp}/hermes-home"
            echo "HERMES_RUNTIME_DIR=${tmp}/hermes-runtime"
            echo "UV_CACHE_DIR=${tmp}/uv-cache"
            echo "RUFF_CACHE_DIR=${tmp}/ruff-cache"
          } >> "${GITHUB_ENV}"
          echo "scratch: ${tmp}"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Same pin as this revision's CI (lint.yml / tests.yml). No cache: nothing may be
          # written to or restored into the source checkout.
          version: "0.9.28"
          enable-cache: false

      - name: Create test venv outside source and install editable '.[all,dev]'
        id: venv
        run: |
          set -euo pipefail
          venv="${T271_TMP}/venv"
          uv --version
          uv venv --python 3.13 "${venv}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            py="${venv}/Scripts/python.exe"
          else
            py="${venv}/bin/python"
          fi
          [ -x "${py}" ] || { echo "::error::venv interpreter not found at ${py}"; exit 1; }
          echo "HERMES_PYTHON=${py}" >> "${GITHUB_ENV}"
          export HERMES_PYTHON="${py}"

          # Bounded retry for transient registry/network failures during the install only.
          n=0
          until env -u PYTHONPATH -u PYTHONHOME -u __HERMES_ACTIVATED \
                uv pip install --python "${py}" -e '.[all,dev]' 2>&1 | tee -a "${T271_TMP}/logs/install.log"; do
            n=$((n + 1))
            if [ "${n}" -ge 3 ]; then
              echo "::error::editable install failed after ${n} attempts"
              exit 1
            fi
            echo "::warning::install attempt ${n} failed; retrying in 10s"
            sleep 10
          done

          "${py}" -I -X utf8 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13), sys.version_info"
          "${py}" -I -X utf8 -c "import pytest; print('pytest', pytest.__version__)"
          "${py}" -I -X utf8 -m ruff --version
          # Enforced provenance: the isolated interpreter is the external venv python and the
          # candidate backend module is loaded from this frozen checkout.
          "${py}" -I -X utf8 - <<'PY'
          import hashlib
          import os
          import sys

          import tools.computer_use.cua_backend as backend


          def real(path):
              return os.path.normcase(os.path.realpath(path))


          expected_python = os.environ["HERMES_PYTHON"]
          expected_backend = os.path.join(os.getcwd(), "tools", "computer_use", "cua_backend.py")
          print("sys.executable      :", sys.executable)
          print("HERMES_PYTHON       :", expected_python)
          print("cua_backend.__file__:", backend.__file__)
          print("expected backend    :", expected_backend)
          with open(backend.__file__, "rb") as fh:
              print("cua_backend sha256  :", hashlib.sha256(fh.read()).hexdigest())
          if real(sys.executable) != real(expected_python):
              sys.exit("::error::sys.executable does not resolve to HERMES_PYTHON")
          if real(backend.__file__) != real(expected_backend):
              sys.exit("::error::cua_backend was not loaded from the frozen checkout")
          PY

      - name: Canonical computer-use tests (scripts/run_tests.sh)
        id: tests
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.venv.outcome == 'success' }}
        run: |
          set -uo pipefail
          # Existing computer-use test paths only. The hermes_cli pattern matches nothing at this
          # base; nullglob drops unmatched patterns instead of passing them through literally.
          shopt -s nullglob
          paths=(tests/tools/test_computer_use*.py tests/hermes_cli/test_computer_use*.py)
          shopt -u nullglob
          paths+=(tests/computer_use/)
          echo "test paths:"; printf '  %s\n' "${paths[@]}"
          found=0
          for p in "${paths[@]}"; do
            [ "${p}" = "tests/tools/test_computer_use_cua_036_token_targeting.py" ] && found=1
          done
          [ "${found}" = 1 ] || { echo "::error::new regression test file missing from discovery"; exit 1; }

          set +e
          bash scripts/run_tests.sh "${paths[@]}" -j 4 --file-timeout 120 2>&1 | tee "${T271_TMP}/logs/tests.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "${rc}" > "${T271_TMP}/logs/tests.rc"
          echo "scripts/run_tests.sh exit code: ${rc}"
          [ "${rc}" = 0 ] || exit "${rc}"

          # Exactly 19 per-file rows, and >= 333 passed in the focused token-targeting file.
          # Platform totals may vary and skips stay visible in the rows; no all-platform total is asserted.
          "${HERMES_PYTHON}" -I -X utf8 - "${T271_TMP}/logs/tests.log" <<'PY'
          import re
          import sys

          row = re.compile(r"^\[\s*[\d.]+%\s*\|.*\|\s*✗\s*\d+\]\s+([✓✗])\s+(\S+)\s+\((.*)\)\s*$")
          files = {}
          with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  m = row.match(line.rstrip("\r\n"))
                  if m:
                      files[m.group(2).replace("\\", "/")] = (m.group(1), m.group(3))
          print(f"per-file rows: {len(files)}")
          if len(files) != 19:
              sys.exit(f"::error::expected exactly 19 per-file test rows, found {len(files)}")
          bad = [f for f, (status, _) in files.items() if status != "✓"]
          if bad:
              sys.exit(f"::error::failing per-file rows: {bad}")
          focused = [v for f, v in files.items() if f.endswith("tests/tools/test_computer_use_cua_036_token_targeting.py")]
          if len(focused) != 1:
              sys.exit("::error::focused token-targeting file row not found exactly once")
          m = re.search(r"(\d+)✓", focused[0][1])
          passed = int(m.group(1)) if m else 0
          print(f"token-targeting passed: {passed} (minimum 333)")
          if passed < 333:
              sys.exit(f"::error::token-targeting passed {passed} < 333")
          PY

      - name: ruff check .
        id: ruff
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.venv.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          "${HERMES_PYTHON}" -I -X utf8 -m ruff check . 2>&1 | tee "${T271_TMP}/logs/ruff.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "${rc}" > "${T271_TMP}/logs/ruff.rc"
          echo "ruff exit code: ${rc}"
          exit "${rc}"

      - name: Windows footguns (--all)
        id: footguns
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.venv.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          "${HERMES_PYTHON}" -I -X utf8 scripts/check-windows-footguns.py --all 2>&1 | tee "${T271_TMP}/logs/footguns.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "${rc}" > "${T271_TMP}/logs/footguns.rc"
          echo "check-windows-footguns exit code: ${rc}"
          exit "${rc}"

      - name: Source checkout must be clean (git status --porcelain)
        id: clean
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [ "${head}" = "${FROZEN_SHA}" ] || { echo "::error::HEAD moved during the run: ${head}"; exit 1; }
          status="$(git status --porcelain)"
          if [ -n "${status}" ]; then
            echo "::error::checkout is dirty after the gates:"
            printf '%s\n' "${status}"
            exit 1
          fi
          echo "git status --porcelain is empty; HEAD still ${head}"

      - name: Job summary
        if: ${{ always() }}
        env:
          OUT_VERIFY: ${{ steps.verify.outcome }}
          OUT_VENV: ${{ steps.venv.outcome }}
          OUT_TESTS: ${{ steps.tests.outcome }}
          OUT_RUFF: ${{ steps.ruff.outcome }}
          OUT_FOOTGUNS: ${{ steps.footguns.outcome }}
          OUT_CLEAN: ${{ steps.clean.outcome }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          tested="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          logs="${T271_TMP:-}/logs"
          {
            echo "## T-271 Cua backport qualification — ${MATRIX_OS}"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Tested source (git HEAD) | \`${tested}\` |"
            echo "| Expected frozen SHA | \`${FROZEN_SHA}\` |"
            echo "| Installed base (ancestor) | \`${BASE_SHA}\` |"
            echo "| Controller workflow commit | \`${GITHUB_SHA}\` (${GITHUB_REF}) |"
            echo "| Runner | ${RUNNER_OS} / ${RUNNER_ARCH} |"
            echo
            echo "| Gate | Outcome | Exit code |"
            echo "|---|---|---|"
            echo "| Frozen source identity | ${OUT_VERIFY} | - |"
            echo "| venv + editable install (py3.13, uv 0.9.28) | ${OUT_VENV} | - |"
            echo "| scripts/run_tests.sh (computer-use) | ${OUT_TESTS} | $(cat "${logs}/tests.rc" 2>/dev/null || echo n/a) |"
            echo "| ruff check . | ${OUT_RUFF} | $(cat "${logs}/ruff.rc" 2>/dev/null || echo n/a) |"
            echo "| check-windows-footguns --all | ${OUT_FOOTGUNS} | $(cat "${logs}/footguns.rc" 2>/dev/null || echo n/a) |"
            echo "| git status --porcelain empty | ${OUT_CLEAN} | - |"
            echo
            echo "> Qualification of the frozen commit above only. This is **not** proof of the full upstream CI."
            if [ -f "${logs}/tests.log" ]; then
              echo
              echo "<details><summary>run_tests.sh output (last 40 lines)</summary>"
              echo
              echo '```'
              tail -n 40 "${logs}/tests.log"
              echo '```'
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload gate logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t271-gate-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/t271/logs
          if-no-files-found: warn
          retention-days: 7
